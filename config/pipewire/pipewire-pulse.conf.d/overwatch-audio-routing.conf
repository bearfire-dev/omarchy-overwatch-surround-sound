# Wine can mark a selected output as immovable. Select the effects sink before
# PipeWire creates each Overwatch playback stream, so no later move is needed.
stream.rules = [
	{
		matches = [
			{
				media.class = "Stream/Output/Audio"
				application.name = "Overwatch"
			}
		]
		actions = {
			update-props = {
				target.object = "easyeffects_sink"
			}
		}
	}
]
