HEADSET_SINK="alsa_output.usb-Logitech_PRO_X_Wireless_Gaming_Headset-00.analog-stereo"
PRESET_NAME="PRO X Overwatch Conservative"
# The pattern matches the process name, which Linux truncates to 15 characters.
PROCESS_PATTERN="Overwatch\\.exe"
# The pattern matches the stream properties that the game sets.
STREAM_PATTERN="Overwatch\\.exe"
POLL_INTERVAL="0.5"
HEALTH_INTERVAL="5"
# Refresh PipeWire after this age, but only when the audio graph is idle.
AUDIO_GRAPH_MAX_AGE_SECONDS="86400"
