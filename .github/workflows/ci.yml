name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Immutable checks
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      - name: Check out the source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install check tools
        run: sudo apt-get update && sudo apt-get install --yes jq shellcheck systemd

      - name: Validate
        env:
          REQUIRE_SHELLCHECK: "1"
        run: ./tests/check.sh

      - name: Validate workflows
        run: docker run --rm --volume "$PWD:/repo:ro" --workdir /repo rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
