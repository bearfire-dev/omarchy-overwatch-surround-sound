name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    name: Build immutable release
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      - name: Check out the source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install check tools
        run: sudo apt-get update && sudo apt-get install --yes jq shellcheck systemd

      - name: Validate
        env:
          REQUIRE_SHELLCHECK: "1"
        run: ./tests/check.sh

      - name: Validate workflows
        run: docker run --rm --volume "$PWD:/repo:ro" --workdir /repo rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667

      - name: Verify the version tag
        run: test "v$(cat VERSION)" = "$GITHUB_REF_NAME"

      - name: Build deterministic archive
        shell: bash
        run: |
          set -euo pipefail
          artifact="omarchy-overwatch-surround-sound-$(cat VERSION)"
          mkdir -p dist
          git archive --format=tar --prefix="$artifact/" "$GITHUB_SHA" | gzip -n -9 > "dist/$artifact.tar.gz"
          cd dist
          sha256sum "$artifact.tar.gz" > "$artifact.tar.gz.sha256"

      - name: Attest the release archive
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a
        with:
          subject-path: dist/*.tar.gz

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
